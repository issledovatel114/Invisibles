<!doctype html>
<html lang="en-us">
  <head>

    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes" />
    <title>Unity Web Player | Invisibles</title>

      #unity-canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      #diagnostics-icon {
        position: fixed;
        bottom: 10px;
        right: 0;
      }

    <canvas
      id="unity-canvas"
      width="960"
      height="600"
      tabindex="-1"
      style="background: #231F20"
    ></canvas>
    <script src="Build/Build_VK.loader.js"></script>
    <script>
            createUnityInstance(document.querySelector("#unity-canvas"), {
              arguments: [],
              dataUrl: "Build/Build_VK.data.unityweb",
              frameworkUrl: "Build/Build_VK.framework.js.unityweb",
              codeUrl: "Build/Build_VK.wasm.unityweb",
              streamingAssetsUrl: "StreamingAssets",
              companyName: "Sfera",
              productName: "Invisibles",
              productVersion: "1.3",
